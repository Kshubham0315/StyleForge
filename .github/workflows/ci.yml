name: StyleForge CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build & Typecheck Frontend
        working-directory: ./frontend
        run: pnpm run build

  test-backend:
    name: Backend & ML Model Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install fastapi uvicorn pydantic pydantic-settings sqlalchemy alembic prometheus_client redis mlflow pytest httpx

      - name: Run Core Engine & ML Tests
        run: |
          python -m pytest tests/test_core_engine.py tests/test_models.py tests/test_losses.py tests/test_inference.py tests/test_model_registry.py -v

      - name: Run Backend REST API Tests
        run: |
          python -m pytest tests/test_backend_api.py -v
