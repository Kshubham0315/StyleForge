name: StyleForge CD Release & Docker Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-push-docker:
    name: Build & Publish Container Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          tags: styleforge/backend:latest,styleforge/backend:${{ github.ref_name }}

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          tags: styleforge/frontend:latest,styleforge/frontend:${{ github.ref_name }}
