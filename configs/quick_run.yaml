# Quick run configuration for rapid testing and CI verification
experiment:
  name: "quick_run_smoke_test"
  exp_dir: "experiments/quick_run"

model:
  type: "stylegan"
  latent_dim: 128
  style_dim: 128
  num_mapping_layers: 4
  img_channels: 3
  img_size: 64
  base_channels: 128
  max_channels: 128
  use_attention: false
  use_minibatch_std: true
  use_spectral_norm: false

data:
  dataset_path: "data/celeba/img_align_celeba"
  use_synthetic: true
  synthetic_samples: 100
  img_size: 64
  batch_size: 8
  num_workers: 0

training:
  total_steps: 50
  lr_g: 0.0002
  lr_d: 0.0002
  beta1: 0.0
  beta2: 0.99
  n_critic: 2
  loss_mode: "wgan_gp"
  penalty_weight: 10.0
  style_mixing_prob: 0.3
  ema_decay: 0.99
  amp: true
  sample_every: 10
  checkpoint_every: 25
