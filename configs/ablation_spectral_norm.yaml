# StyleForge with Spectral Normalization in Critic
experiment:
  name: "ablation_spectral_norm"
  exp_dir: "experiments/ablation_spectral_norm"
  seed: 42

model:
  type: "stylegan"
  latent_dim: 512
  style_dim: 512
  num_mapping_layers: 8
  img_channels: 3
  img_size: 64
  base_channels: 512
  max_channels: 512
  use_attention: false
  use_minibatch_std: true
  use_spectral_norm: true

data:
  dataset_path: "data/celeba/img_align_celeba"
  use_synthetic: false
  synthetic_samples: 500
  img_size: 64
  batch_size: 16
  num_workers: 0

training:
  total_steps: 150
  lr_g: 0.0001
  lr_d: 0.0001
  beta1: 0.0
  beta2: 0.99
  n_critic: 2
  loss_mode: "wgan_gp"
  penalty_weight: 10.0
  style_mixing_prob: 0.2
  ema_decay: 0.999
  amp: true
  sample_every: 25
  checkpoint_every: 50
